# Настройки поиска вакансий в Threads.
# Темы и стоп-слова берутся из config.yaml (categories, stop_words) — здесь только то, что касается Threads.
# Этот файл можно менять прямо на github.com (значок карандаша ✏️ справа вверху).

# Сколько постов присылать за раз (не больше)
per_day: 10

# За сколько последних дней искать посты
days: 3

# Что вводить в поиск Threads. Каждая фраза — отдельный запрос (лимит Threads — 2200 запросов в сутки,
# так что десятки фраз — не проблема). Threads ищет посты, где есть все слова фразы.
search:
  - вакансия маркетолог
  - вакансия SMM
  - вакансия SMM-менеджер
  - вакансия контент-менеджер
  - вакансия копирайтер
  - вакансия таргетолог
  - вакансия event-менеджер
  - вакансия project manager
  - вакансия product manager
  - ищем маркетолога
  - ищем SMM
  - ищем контент-менеджера
  - вакансия Минск

# Пост подходит, только если в нём есть одно из этих слов: так отсеиваются посты,
# где люди сами ищут работу или просто рассуждают о профессии.
# Достаточно начала слова: «ваканс» найдёт и «вакансия», и «вакансии».
vacancy_words: [ваканс, ищем, в команду, в нашу команду, требуется, открыта позиция, hiring, we are looking]

# Пост подходит, только если в нём есть одно из этих слов (город или удалёнка).
# Пустой список [] — из любого места.
place_words: [минск, беларус, рб, удален, удалён, remote, дистанц]

# Если в посте есть одно из этих слов — он пропускается (например, человек сам ищет работу
# или это реклама курсов).
stop_words: [ищу работу, ищу вакансию, курсы по, курс по, марафон]
