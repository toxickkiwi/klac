# Поиск в Threads постов, где ищут специалиста («ищу маркетолога», «нужен SMM» и т. п.).
# Посты собирает парсер на Apify (нужен секрет APIFY_TOKEN на GitHub, см. README).

# Парсер на Apify и сколько постов брать за один запуск.
# Каждый пост стоит денег (примерно $2.5–10 за 1000 — проверьте на странице парсера),
# поэтому держите max_posts небольшим, чтобы укладываться в бесплатные $5 в месяц.
apify_actor: ethereal_wool~threads-search-scraper
max_posts: 40

# Сколько найденных постов присылать за раз
per_day: 10

# Брать посты не старше стольких дней
max_age_days: 3

# Что искать в Threads. Каждая фраза — отдельный поиск.
search:
  - ищу маркетолога
  - ищем маркетолога
  - нужен маркетолог
  - ищу smm
  - ищем smm специалиста
  - нужен таргетолог
  - ищем event менеджера
  - ищем project manager
  - вакансия маркетолог минск
  - ищем в команду минск

# Пост подходит, только если в нём есть одно из этих слов — что ищут сотрудника…
hiring_words: [ищу, ищем, нужен, нужна, нужны, требуется, требуются, в поиске, вакансия,
               открыта вакансия, приглашаем, присоединяйся, в команду, hiring]

# …и одно из этих — что пост из Беларуси.
belarus_words: [минск, беларус, рб, byn, бел. руб, гомел, брест, гродн, витебск, могил, барановичи,
                бобруйск, борисов, минске, belarus, minsk]

# Посты с этими словами пропускаем — так пишут те, кто сам ищет работу или продаёт услуги.
stop_words: [ищу работу, ищу подработку, резюме, открыта к предложениям, открыт к предложениям,
             беру проекты, беру в работу, есть места, свободные места, мои услуги, ищу клиентов,
             ищу заказ, портфолио]
