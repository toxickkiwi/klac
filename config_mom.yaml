# Личный поиск «👩 Для мамы». Запускается кнопкой в Telegram, видит только владелец бота.
# Формат такой же, как у config.yaml, плюс фильтры профиля (only_city, min_salary, text_stop_words).

per_day: 5
send_to: owner            # присылать только владельцу бота (первый Id в TELEGRAM_CHAT_ID)
extra_title: "👩 Вакансии для мамы"
button: {text: "👩 Ещё для мамы", data: "mom"}
show_salary: true

only_city: Минск          # только Минск, без удалёнки
prefer_city: Минск
min_salary: 1800          # BYN

sources:
  - rabota.by
  - praca.by
  - minsk.business
  - belmeta.com
  - bebee.com

# Пропускать вакансии без указанной зарплаты (true — да, false — нет)
require_salary: true

# В какой валюте может быть зарплата (BYN — белорусские рубли, USD — доллары).
# Вакансии с зарплатой в других валютах, например в российских рублях, пропускаются.
currencies: [BYN, USD]

# Пропускать вакансии «планируемые к созданию (перспективные)» — такого места пока нет
skip_planned: true

experience: []
experience_unknown: true

# Если в названии есть одно из этих слов — пропускаем
stop_words: [продаж, продав, sales, кассир, call, колл, телемаркет, торговый представ,
             системн, сетев, баз данн, 1с, сайт, стажер, стажёр,
             электромонт, электрик, слесар, сантехник, водител, уборщ, дворник, грузчик, рабоч, механик,
             it-координатор, координатор it, ии, ai, разработ, программист, бухгалтер, инженер, врач,
             медсестр, повар, официант, бармен, охранник, администратор сайт, администратор сет]

# Если в тексте вакансии есть одно из этих слов — пропускаем
text_stop_words: [английск, english, ночн]

# Не больше стольких вакансий одной сферы за раз — чтобы подборка была разнообразной
max_per_category: 2

categories:
  - name: Помощник руководителя
    priority: 1
    search: [помощник руководителя, секретарь, референт, офис-менеджер, ассистент руководителя,
             секретарь-референт, личный помощник]
    title: [помощник руководител, помощник директор, личный помощник, секретар, референт,
            офис-менеджер, офис менеджер, ассистент руковод, ассистент директор, executive assistant]

  - name: Администратор
    priority: 1
    search: [администратор, администратор офиса, администратор салона, администратор медицинского центра,
             администратор клиники, администратор ресепшн, старший администратор, администратор гостиницы,
             администратор фитнес, администратор стоматологии, администратор бизнес-центра]
    title: [администратор, ресепшн, reception, front desk]

  - name: АХО
    priority: 1
    search: [заведующий хозяйством, завхоз, административно-хозяйственный, заместитель директора по АХР,
             руководитель АХО, менеджер АХО, комендант]
    title: [завхоз, заведующ хозяйств, заведующий хозяйств, ахо, ахч, ахр, ахд, административно-хозяйств,
            хозяйствен, комендант]

  - name: Управление недвижимостью
    priority: 1
    search: [управляющий бизнес-центром, менеджер по работе с арендаторами, управляющий объектом недвижимости,
             менеджер по эксплуатации здания]
    title: [управляющ, арендатор, недвижимост]

  - name: Документооборот и кадры
    priority: 2
    search: [делопроизводитель, документовед, архивариус, специалист по документообороту,
             специалист по кадрам, инспектор по кадрам, менеджер по персоналу]
    title: [делопроизвод, документовед, документооборот, архивариус, архив, кадр, персонал]

  - name: Договоры и координация
    priority: 2
    search: [специалист по договорной работе, координатор, менеджер по организации мероприятий,
             специалист по сертификации, специалист по тендерам]
    title: [договорн, координатор, организации мероприят, сертификац, тендер]

  - name: ВЭД
    priority: 3
    search: [менеджер ВЭД, специалист ВЭД, декларант, специалист по таможенному оформлению]
    title: [вэд, внешнеэкономич, декларант, таможен]

  - name: Закупки и клининг
    priority: 3
    search: [специалист по закупкам, снабженец, менеджер по клинингу, руководитель клининга]
    title: [закуп, снабжен, клининг]
