name: Вакансии дня

on:
  schedule:
    # Основной будильник — Cron Trigger в Cloudflare (см. README): он срабатывает вовремя.
    # Это запасной запуск: GitHub часто опаздывает на несколько часов, поэтому он
    # ничего не отправит, если утренняя подборка сегодня уже пришла.
    - cron: "50 4 * * *"
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска
    inputs:
      experience:
        description: "Опыт работы (только для этого запуска)"
        type: choice
        default: как в config.yaml
        options:
          - как в config.yaml
          - любой
          - без опыта
          - 1-3
          - 3-6
          - 6+
          - без опыта, 1-3
      count:
        description: "Сколько вакансий прислать (пусто — как в config.yaml)"
        type: string
        default: ""
      profile:
        description: "main — вакансии для канала, mom — поиск для мамы, threads — посты из Threads"
        type: choice
        default: main
        options:
          - main
          - mom
          - threads
      mode:
        description: "daily — утренняя подборка, extra — «Ещё вакансии»"
        type: choice
        default: daily
        options:
          - daily
          - extra

permissions:
  contents: write # чтобы сохранять sent.json с уже отправленными вакансиями

concurrency:
  group: daily-vacancies # запуски идут по очереди, чтобы вакансии не повторялись
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Найти вакансии и отправить в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPERIENCE: ${{ inputs.experience }}
          COUNT: ${{ inputs.count }}
          MODE: ${{ inputs.mode }}
          PROFILE: ${{ inputs.profile }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SKIP_IF_SENT: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python parser.py

      # Утром вслед за вакансиями — подборка постов из Threads (если задан APIFY_TOKEN).
      - name: Найти посты в Threads
        if: ${{ (inputs.profile == '' || inputs.profile == 'main') && inputs.mode != 'extra' }}
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PROFILE: threads
          SKIP_IF_SENT: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python parser.py

      - name: Запомнить отправленные вакансии
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent*.json
          git diff --cached --quiet || git commit -m "Отправленные вакансии за $(date +%d.%m.%Y)"
          git pull --rebase
          git push
