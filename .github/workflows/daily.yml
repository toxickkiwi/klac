name: Вакансии дня

on:
  schedule:
    # 04:50 по UTC = 07:50 по Минску. GitHub обычно запускает с задержкой
    # в 5–15 минут, поэтому сообщение приходит около 8:00.
    - cron: "50 4 * * *"
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска
    inputs:
      experience:
        description: "Опыт работы (только для этого запуска)"
        type: choice
        default: как в config.yaml
        options:
          - как в config.yaml
          - любой
          - без опыта
          - 1-3
          - 3-6
          - 6+
          - без опыта, 1-3

permissions:
  contents: write # чтобы сохранять sent.json с уже отправленными вакансиями

concurrency:
  group: daily-vacancies

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Найти вакансии и отправить в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXPERIENCE: ${{ inputs.experience }}
        run: python parser.py

      - name: Запомнить отправленные вакансии
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || git commit -m "Отправленные вакансии за $(date +%d.%m.%Y)"
          git push
