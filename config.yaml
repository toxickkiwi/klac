# Настройки парсера вакансий «Клацай, працуй!»
# Этот файл можно менять прямо на github.com (значок карандаша ✏️ справа вверху).
# Строки, начинающиеся с #, — комментарии, на работу они не влияют.

# Сколько вакансий присылать в день
per_day: 2

# Город, вакансии из которого (и удалёнка) показываются в первую очередь.
# Вакансии из других городов Беларуси тоже подходят, но идут после.
prefer_city: Минск

# На каких сайтах искать. Чтобы отключить сайт, поставьте # в начале его строки.
sources:
  - rabota.by
  - praca.by
  - minsk.business
  - belmeta.com
  - careerist.ru
  - bebee.com
  # gorodrabot.by не пускает серверы GitHub (отвечает «слишком много запросов»).
  # - gorodrabot.by

# Опыт работы. Впишите нужные варианты через запятую:
#   без опыта, 1-3, 3-6, 6+
# Примеры: experience: [без опыта]   или   experience: [без опыта, 1-3]
# Пустой список [] — любой опыт.
experience: []

# Показывать ли вакансии, где опыт не указан (true — да, false — нет).
# Работает, только когда выше выбран какой-то опыт.
experience_unknown: true

# Если в названии вакансии есть одно из этих слов — она пропускается.
# Пример: stop_words: [продаж, стажер, промоутер]
stop_words: []

# Сферы. Чем меньше priority, тем важнее сфера: сначала берутся вакансии с priority 1.
#   search — что вводить в поиск на сайтах;
#   title  — вакансия подходит, только если в её названии есть одно из этих слов
#            (достаточно начала слова: «маркет» найдёт и «маркетолог», и «маркетинг»;
#             короткие слова до 3 букв, например «pr» или «ux», ищутся целиком).
categories:
  - name: Маркетинг
    priority: 1
    search: [маркетолог, маркетинг, бренд-менеджер, PR-менеджер, таргетолог, интернет-маркетолог]
    title: [маркет, бренд, pr, таргет, digital, performance, seo, marketing, brand]

  - name: SMM
    priority: 2
    search: [SMM, контент-менеджер, копирайтер]
    title: [smm, контент, копирайт, соцсет, социальных сет, content]

  - name: Event
    priority: 2
    search: [event-менеджер, организатор мероприятий, ивент-менеджер]
    title: [event, ивент, мероприят]

  - name: Project
    priority: 3
    search: [project manager, менеджер проектов, руководитель проектов]
    title: [project, менеджер проект, руководитель проект, менеджер по проект, pm]

  - name: Product
    priority: 3
    search: [product manager, продакт-менеджер, менеджер продукта]
    title: [product, продакт, менеджер продукт, менеджер по продукт]

  - name: IT
    priority: 3
    search: [бизнес-аналитик, UX/UI дизайнер, IT-рекрутер]
    title: [аналитик, ux, ui, рекрутер, recruiter, analyst]
